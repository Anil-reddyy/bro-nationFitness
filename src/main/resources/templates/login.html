<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Bro Nation Fitness</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    rgba(5, 10, 18, 0.96),
                    rgba(20, 28, 40, 0.90)
                ),
                url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Animated background glow */

        body::before {
            content: "";
            position: absolute;

            width: 500px;
            height: 500px;

            background: rgba(255, 60, 70, 0.18);

            border-radius: 50%;

            filter: blur(120px);

            top: -150px;
            right: -100px;

            animation: floatGlow 6s ease-in-out infinite;
        }

        body::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            background: rgba(40, 100, 255, 0.12);

            border-radius: 50%;

            filter: blur(120px);

            bottom: -150px;
            left: -100px;

            animation: floatGlow 8s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -30px);
            }

        }

        .login-wrapper {
            position: relative;
            z-index: 10;

            width: 100%;
            max-width: 500px;

            animation: loginEntrance 0.9s ease forwards;
        }

        @keyframes loginEntrance {

            from {
                opacity: 0;
                transform: translateY(50px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        .login-card {

            background: rgba(20, 30, 45, 0.92);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            padding: 45px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55);

        }

        .logo {

            width: 72px;
            height: 72px;

            margin: auto;
            margin-bottom: 25px;

            border-radius: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 36px;

            background:
                linear-gradient(135deg, #ff2d3d, #ff6a3d);

            box-shadow:
                0 15px 35px rgba(255,45,61,0.4);

            animation: logoPulse 2.5s infinite;
        }

        @keyframes logoPulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

        }

        h1 {

            color: white;

            text-align: center;

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #9ca9bb;

            text-align: center;

            margin-bottom: 35px;
        }

        label {

            color: #c5cedb;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .form-control {

            height: 56px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.08);

            background: rgba(255,255,255,0.95);

            font-size: 16px;

            padding-left: 18px;

            margin-bottom: 22px;

            transition: 0.3s;
        }

        .form-control:focus {

            border-color: #ff3b4d;

            box-shadow:
                0 0 0 4px rgba(255,59,77,0.15);

        }

        .login-btn {

            width: 100%;

            height: 58px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 17px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #ff2d3d,
                    #ff633d
                );

            box-shadow:
                0 12px 30px rgba(255,45,61,0.35);

            transition: 0.3s;

        }

        .login-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 18px 40px rgba(255,45,61,0.5);

        }

        .login-btn.loading {

            pointer-events: none;

            opacity: 0.9;

        }

        .spinner {

            display: none;

            width: 20px;
            height: 20px;

            border: 3px solid rgba(255,255,255,0.4);

            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin-right: 10px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .error-message {

            background: rgba(255, 50, 70, 0.12);

            border: 1px solid rgba(255, 50, 70, 0.35);

            color: #ff8993;

            padding: 14px;

            border-radius: 12px;

            margin-bottom: 20px;

        }

        .logout-message {

            background: rgba(40, 190, 130, 0.12);

            border: 1px solid rgba(40, 190, 130, 0.35);

            color: #72d9ae;

            padding: 14px;

            border-radius: 12px;

            margin-bottom: 20px;

        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            💪
        </div>

        <h1>Bro Nation Fitness</h1>

        <p class="subtitle">
            Welcome back! Sign in to manage your gym.
        </p>


        <!-- ERROR -->

        <div th:if="${param.error}" class="error-message">

            ❌ Invalid username or password.

        </div>


        <!-- LOGOUT -->

        <div th:if="${param.logout}" class="logout-message">

            ✓ You have been logged out successfully.

        </div>


        <!-- LOGIN FORM -->

        <form
            th:action="@{/login}"
            method="post"
            id="loginForm"
        >

            <label>Username</label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                <span
                    class="spinner"
                    id="spinner"
                ></span>

                <span id="buttonText">

                    Sign In →

                </span>

            </button>

        </form>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const spinner =
        document.getElementById("spinner");

    const buttonText =
        document.getElementById("buttonText");


    loginForm.addEventListener("submit", function () {

        loginButton.classList.add("loading");

        spinner.style.display =
            "inline-block";

        buttonText.innerText =
            "Signing you in...";

    });

</script>

</body>

</html>
