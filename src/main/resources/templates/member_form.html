<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${member.id == null ? 'Add Member' : 'Edit Member'} + ' - Bro Nation Fitness'">
        Bro Nation Fitness
    </title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background:
                    linear-gradient(
                            rgba(5, 10, 18, 0.88),
                            rgba(5, 10, 18, 0.94)
                    ),
                    url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #ffffff;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar-custom {

            background: rgba(9, 16, 28, 0.95);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            padding: 18px 0;
        }


        .navbar-brand {

            font-size: 22px;

            font-weight: 700;

            color: #ffffff !important;

            letter-spacing: 0.3px;
        }


        .navbar-brand span {

            color: #ff3b4d;
        }


        .nav-link {

            color: #aeb8c7 !important;

            margin-left: 15px;

            font-weight: 500;

            transition: 0.25s;
        }


        .nav-link:hover {

            color: #ffffff !important;
        }


        .nav-link.active {

            color: #ff4b5c !important;

            font-weight: 600;
        }


        .logout-link {

            color: #ff6b78 !important;
        }


        /* =========================
           PAGE
        ========================= */

        .page-container {

            max-width: 1100px;

            margin: auto;

            padding: 60px 20px;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {

            margin-bottom: 30px;
        }


        .page-header h1 {

            font-size: 34px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .page-header p {

            color: #9ca8b8;

            font-size: 16px;
        }


        .header-icon {

            width: 55px;

            height: 55px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            margin-right: 15px;

            background: linear-gradient(
                    135deg,
                    #ff3b4d,
                    #b5179e
            );

            box-shadow:
                    0 10px 30px rgba(255, 59, 77, 0.3);
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {

            background:
                    rgba(20, 30, 45, 0.92);

            border:

                    1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            padding: 38px;

            box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(20px);
        }


        /* =========================
           FORM LABELS
        ========================= */

        .form-label {

            color: #dbe2ea;

            font-weight: 600;

            margin-bottom: 9px;

            font-size: 14px;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-control,
        .form-select {

            background:
                    rgba(255, 255, 255, 0.06) !important;

            border:
                    1px solid rgba(255, 255, 255, 0.12);

            color:
                    #ffffff !important;

            border-radius:
                    12px;

            padding:
                    13px 15px;

            min-height:
                    52px;

            transition:
                    all 0.25s ease;
        }


        .form-control::placeholder {

            color:
                    #8390a0;

            opacity:
                    1;
        }


        .form-control:focus,
        .form-select:focus {

            background:
                    rgba(255, 255, 255, 0.09) !important;

            color:
                    #ffffff !important;

            border-color:
                    #ff3b4d;

            box-shadow:
                    0 0 0 4px rgba(255, 59, 77, 0.12);
        }


        /* Select options */

        .form-select option {

            background:
                    #182434;

            color:
                    #ffffff;
        }


        /* Date icon */

        input[type="date"]::-webkit-calendar-picker-indicator {

            filter:
                    invert(1);

            cursor:
                    pointer;
        }


        /* Textarea */

        textarea.form-control {

            min-height:
                    120px;

            resize:
                    vertical;
        }


        /* =========================
           SECTION DIVIDER
        ========================= */

        .section-title {

            font-size:
                    17px;

            font-weight:
                    600;

            color:
                    #ffffff;

            margin-bottom:
                    25px;

            padding-bottom:
                    15px;

            border-bottom:
                    1px solid rgba(255, 255, 255, 0.08);
        }


        /* =========================
           BUTTONS
        ========================= */

        .btn-save {

            background:
                    linear-gradient(
                            135deg,
                            #ff3b4d,
                            #e11d48
                    );

            border:
                    none;

            color:
                    white;

            border-radius:
                    12px;

            padding:
                    13px 30px;

            font-weight:
                    600;

            transition:
                    0.25s;

            box-shadow:
                    0 10px 25px rgba(255, 59, 77, 0.25);
        }


        .btn-save:hover {

            color:
                    white;

            transform:
                    translateY(-2px);

            box-shadow:
                    0 15px 30px rgba(255, 59, 77, 0.4);
        }


        .btn-cancel {

            background:
                    rgba(255, 255, 255, 0.08);

            border:
                    1px solid rgba(255, 255, 255, 0.12);

            color:
                    #d9e0e8;

            border-radius:
                    12px;

            padding:
                    13px 28px;

            font-weight:
                    600;

            text-decoration:
                    none;

            margin-left:
                    10px;

            transition:
                    0.25s;
        }


        .btn-cancel:hover {

            background:
                    rgba(255, 255, 255, 0.14);

            color:
                    white;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .page-container {

                padding:
                        35px 15px;
            }


            .form-card {

                padding:
                        25px 20px;
            }


            .page-header h1 {

                font-size:
                        28px;
            }


            .btn-save,
            .btn-cancel {

                width:
                        100%;

                margin:
                        5px 0;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">

            <i class="fa-solid fa-dumbbell me-2"></i>

            Bro Nation <span>Fitness</span>

        </a>


        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link" href="/dashboard">

                        <i class="fa-solid fa-chart-line me-1"></i>

                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active" href="/members">

                        <i class="fa-solid fa-users me-1"></i>

                        Members

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link" href="/plans">

                        <i class="fa-solid fa-calendar-check me-1"></i>

                        Plans

                    </a>

                </li>


                <!-- IMPORTANT: Logout should be POST -->

                <li class="nav-item ms-lg-3">

                    <form th:action="@{/logout}" method="post">

                        <button
                                type="submit"
                                class="nav-link logout-link border-0 bg-transparent">

                            <i class="fa-solid fa-right-from-bracket me-1"></i>

                            Logout

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="page-container">


    <!-- PAGE HEADER -->

    <div class="page-header d-flex align-items-center">

        <div class="header-icon">

            <i class="fa-solid fa-user-plus fa-lg"></i>

        </div>


        <div>

            <h1 th:text="${member.id == null ? 'Add New Member' : 'Edit Member'}">

                Add New Member

            </h1>


            <p th:text="${member.id == null ?
                'Register a new member and assign a fitness plan.' :
                'Update member information and membership details.'}">

                Register a new member and assign a fitness plan.

            </p>

        </div>

    </div>



    <!-- FORM CARD -->

    <div class="form-card">


        <div class="section-title">

            <i class="fa-solid fa-id-card me-2 text-danger"></i>

            Member Information

        </div>



        <form
                th:action="@{/members/save}"
                th:object="${member}"
                method="post">


            <!-- Hidden ID for Edit -->

            <input
                    type="hidden"
                    th:field="*{id}">


            <div class="row g-4">


                <!-- NAME -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-user me-2 text-danger"></i>

                        Full Name

                    </label>


                    <input
                            type="text"
                            class="form-control"
                            th:field="*{name}"
                            placeholder="Enter member name"
                            required>

                </div>



                <!-- PHONE -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-phone me-2 text-danger"></i>

                        Phone Number

                    </label>


                    <input
                            type="text"
                            class="form-control"
                            th:field="*{phone}"
                            placeholder="Enter phone number"
                            required>

                </div>



                <!-- EMAIL -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-envelope me-2 text-danger"></i>

                        Email Address

                    </label>


                    <input
                            type="email"
                            class="form-control"
                            th:field="*{email}"
                            placeholder="Enter email address">

                </div>



                <!-- PLAN -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-dumbbell me-2 text-danger"></i>

                        Membership Plan

                    </label>


                    <select
                            class="form-select"
                            name="planId"
                            required>


                        <option value="" disabled
                                th:selected="${member.plan == null}">

                            Select a membership plan

                        </option>


                        <option
                                th:each="plan : ${plans}"
                                th:value="${plan.id}"
                                th:text="${plan.name + ' (' + plan.durationMonths + ' months)'}"
                                th:selected="${member.plan != null && member.plan.id == plan.id}">

                        </option>


                    </select>

                </div>



                <!-- START DATE -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-calendar me-2 text-danger"></i>

                        Start Date

                    </label>


                    <input
                            type="date"
                            class="form-control"
                            th:field="*{startDate}">

                </div>



                <!-- NOTES -->

                <div class="col-md-6">

                    <label class="form-label">

                        <i class="fa-solid fa-note-sticky me-2 text-danger"></i>

                        Notes

                    </label>


                    <textarea
                            class="form-control"
                            th:field="*{notes}"
                            placeholder="Add optional notes about the member...">

                    </textarea>

                </div>


            </div>



            <!-- ACTION BUTTONS -->

            <div class="mt-5 pt-3 border-top border-secondary">


                <button
                        type="submit"
                        class="btn btn-save">

                    <i class="fa-solid fa-check me-2"></i>

                    <span th:text="${member.id == null ? 'Add Member' : 'Update Member'}">

                        Save Member

                    </span>

                </button>


                <a
                        href="/members"
                        class="btn-cancel">

                    <i class="fa-solid fa-arrow-left me-2"></i>

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>



<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
